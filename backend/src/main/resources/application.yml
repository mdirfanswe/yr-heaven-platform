server:
  port: ${PORT:8080}

spring:
  application:
    name: yr-heaven-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/yr_heaven_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.yrheaven: DEBUG
    org.flywaydb: INFO