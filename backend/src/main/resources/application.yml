server:
  port: ${PORT:8080}

spring:
  application:
    name: yr-heaven-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/yr_heaven_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
app:
  security:
    # Must be at least 32 characters (256-bit) for HMAC-SHA256
    jwt-secret: ${JWT_SECRET:dev-only-yr-heaven-secret-key-minimum-32-chars-2026!}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    owner-email: ${INITIAL_OWNER_EMAIL:owner@yrheaven.local}
    owner-password: ${INITIAL_OWNER_PASSWORD:ChangeMe@123}
    owner-name: ${INITIAL_OWNER_NAME:YR Heaven Shop Owner}
    owner-phone: ${INITIAL_OWNER_PHONE:9576545759}

logging:
  level:
    root: INFO
    com.yrheaven: DEBUG
    org.flywaydb: INFO

