services:
  mysql:
    image: mysql:8.0
    container_name: yr_heaven_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: yr_heaven_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - yr_heaven_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  yr_heaven_mysql_data: